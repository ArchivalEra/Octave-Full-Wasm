# emscripten 的 meson 交叉文件（emsdk 5.0.7 不自带，本仓自己写）
# ⚠️ meson 的 machine file **只认单引号**；双引号会报
#    "Malformed value in machine file variable"
[binaries]
c = 'emcc'
cpp = 'em++'
ar = 'emar'
ranlib = 'emranlib'
strip = 'emstrip'
exe_wrapper = 'node'
# 交叉构建下 meson 默认去找「host 机器的 pkg-config」（日志原文：
# "Pkg-config for machine host machine not found. Giving up."），于是找不到自建的
# wasm zlib。显式指定容器里的 pkg-config，并配合 PKG_CONFIG_PATH 指到 zlib 的 .pc。
pkgconfig = 'pkg-config'

[host_machine]
system = 'linux'
cpu_family = 'wasm32'
cpu = 'wasm32'
endian = 'little'

[built-in options]
# -D_GNU_SOURCE：emscripten 的 libc 头要显式开 feature 宏才声明 POSIX 时间函数，
#   否则 Mesa 的 src/c11/impl/{time.c,threads_posix.c} 报
#   "call to undeclared function clock_gettime / nanosleep"。
# -I 那项是兜底：meson **不用**环境里的 CPPFLAGS（实测失败目标的命令行里没有 -I）。
c_args = ['-D_GNU_SOURCE', '-I/src/deps/zlibbz2/include']
c_link_args = ['-L/src/deps/zlibbz2/lib']

[properties]
needs_exe_wrapper = true
