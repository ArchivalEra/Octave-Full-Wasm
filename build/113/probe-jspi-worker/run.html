<meta charset="utf-8">
<title>Q4 · JSPI in DedicatedWorker</title>
<body style="font:13px monospace">
<pre id="out">booting…</pre>
<script>
window.__workerResult = null;
window.__workerError = null;
var w = new Worker('worker.js');
w.onmessage = function (e) {
  window.__workerResult = e.data;
  document.getElementById('out').textContent = JSON.stringify(e.data, null, 1);
};
w.onerror = function (e) {
  window.__workerError = 'worker-onerror: ' + (e && e.message ? e.message : 'unknown');
  document.getElementById('out').textContent = window.__workerError;
};
</script>
