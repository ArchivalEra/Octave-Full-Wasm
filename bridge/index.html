<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Octave Web</title>
  <pre id="output"></pre>
</head>
<body>
<script type="text/javascript" src="assets-loader.js"></script>
<!-- WebAudio 播放桥：Octave 侧把播放意图写进队列，这一侧真开 AudioContext。
     浏览器要求用户手势才能出声，所以页面上任何一次点击都会尝试解锁。 -->
<script type="text/javascript" src="webaudio.js"></script>
<script type="text/javascript">
  var Module = {
    postRun() {
      // Module.FS.mkdir("/working");
      // Module.FS.mount(Module.FS.filesystems["IDBFS"], {}, "/working");

      function chk(rv) {
        if (rv.err) console.error(rv.err);
        if (rv.out) console.log(rv.out);
      }
      function callModule(method, req) {
        let s = Module[method](JSON.stringify(req));
        return JSON.parse(s)
      }
      function disp(resp) {
        document.getElementById("output").innerText = JSON.stringify(resp, null, "  ");
      }

      Module["execute_interp"]();

      Module["eval_string"]('strcat("foo", "baz")');
      Module["feval"]("error", ["foo"], 0);
      // disp(Module["feval"]("strcat", ["foo", "bar"], 1));
      console.log(Module["last_error_message"]());

      // 资产车道：读清单但不预先加载任何东西（能力资产用到哪个才 fetch 哪个）。
      // 控制台里：await OctaveAssets.load('ode15s') / OctaveAssets.list()
      window.OctaveAssets.init().then(function () {
        console.log('[assets] 可用资产: ' + OctaveAssets.list().join(', '));
        // dldfcn 核心组：convhulln/delaunayn/voronoi/glpk/fftw/gzip/audioread 系列。
        // 走官方 dlopen 装载（与桌面版同一机制、同一 exist/which 语义）。
        // 这一组对应"开箱就该能用"的基础几何/压缩/音频，随页面一起装；
        // 其余资产仍按需懒加载。
        // 装不上不算致命——页面照常可用，只是这些函数不存在（会清晰报错）。
        var CORE_DLDFCN = ['convhulln', '__delaunayn__', '__voronoi__',
                           '__glpk__', 'fftw', 'gzip', 'audioread'];
        return OctaveAssets.load(CORE_DLDFCN).catch(function (e) {
          console.warn('[assets] dldfcn 核心组装载失败（这些函数将不可用）: ' + e.message);
          return null;
        });
      }).then(function () {
        window.__octaveReady = true;
      }).catch(function (e) {
        console.warn('[assets] 清单未就绪（无 assets/ 目录时属正常）: ' + e.message);
        window.__octaveReady = true;
      });

      // 音频：开始轮询播放队列；首次点击解锁 AudioContext（浏览器 autoplay 策略）
      if (window.OctaveAudio) {
        window.OctaveAudio.init().catch(function (e) {
          console.warn('[audio] 桥未就绪: ' + e.message);
        });
        window.addEventListener('click', function once() {
          window.OctaveAudio.resume();
          window.removeEventListener('click', once);
        });
      }
    }
  }
</script>
<script type="text/javascript" src="octave.js"></script>
<script type="text/javascript">
  OCTAVE(Module);
</script>
</body>
</html>
