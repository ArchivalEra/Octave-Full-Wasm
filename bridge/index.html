<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Octave Web</title>
  <pre id="output"></pre>
</head>
<body>
<script type="text/javascript" src="assets-loader.js"></script>
<!-- WebAudio 播放桥：Octave 侧把播放意图写进队列，这一侧真开 AudioContext。
     浏览器要求用户手势才能出声，所以页面上任何一次点击都会尝试解锁。 -->
<script type="text/javascript" src="webaudio.js"></script>
<!-- WebAudio **录音**桥（T7）：Octave 侧把录音意图写进队列，这一侧用 getUserMedia +
     MediaRecorder 真采集，再把 PCM 写回 MEMFS 供 getaudiodata 同步读取。
     与播放桥分开两个文件，是因为录音还有权限三态要处理。 -->
<script type="text/javascript" src="webaudiorec.js"></script>
<script type="text/javascript">
  // ── 输出落点（T6c）────────────────────────────────────────────────────────
  // 上游骨架只留了一个空的 `<pre id="output">`，而且**没有人往里写东西**：
  // 实测 `disp(42)` 之后 `document.body.innerText` 仍是空串 —— 所有 Octave 输出
  // 都只进浏览器控制台，页面上什么也看不到。这对"打开链接就能用"是硬缺口，
  // 所以这里把 stdout/stderr **同时**显示到页面。
  //
  // ⚠️ 仍然照常走 console：验收套件（test/browser/accept-*.mjs）读的就是 console
  // 里的输出，只写 DOM 会把 26 套全打掉。是"额外再显示一份"，不是"改道"。
  function octaveUiAppend(s) {
    var el = document.getElementById('output');
    if (!el) {
      el = document.createElement('pre');
      el.id = 'output';
      document.body.appendChild(el);
    }
    el.appendChild(document.createTextNode(s));
    // 只在页面真的可滚动时才跟到底部：输出多的时候避免每次写都做一次布局查询。
    if (document.documentElement.scrollHeight > window.innerHeight) {
      window.scrollTo(0, document.body.scrollHeight);
    }
  }

  var Module = {
    print: function (t) { console.log(t); octaveUiAppend(t + '\n'); },
    printErr: function (t) { console.warn(t); octaveUiAppend(t + '\n'); },
    // stdin：Emscripten 的**官方扩展点**（`/dev/stdin` 的设备回调）。
    //
    // 必须在**启动前**定义：`library_fs.js` 只在 `FS.init()` 时做
    //     FS.createDevice('/dev', 'stdin', Module['stdin'])
    // 启动之后再给 Module.stdin 赋值是**无效的**（已实测：注入后 input() 仍走 TTY）。
    //
    // 不定义它也能用：`/dev/stdin` 会软链到 `/dev/tty`，而 TTY 的默认实现是
    //     result = window.prompt('Input: ')
    // （见 emscripten/library_tty.js 的 default_tty_ops.get_char）。
    // 所以 `input()` **本来就能工作**，弹出的就是浏览器原生对话框。
    //
    // 这里定义它是为了两件事：
    //   1. **可测**：playwright 的 dialog 处理是异步的，而 window.prompt 是同步阻塞，
    //      两者交错会让连续多次 input() 拿到**错位**的答案（实测：答案为上一次的）。
    //      给宿主一个可注入的队列，验收才能确定性地断言数值。
    //   2. **可编排**：宿主页可以预先喂输入，不必弹窗。
    // 空闲时回退到 window.prompt，所以对真人用户的体验与默认行为完全一致。
    //
    // 语义与 Emscripten 的 TTY 实现一致：每次调用返回**一个字符码**，行尾给 `\n`，
    // 无输入时返回 `null` 表示 EOF（Octave 侧表现为 "input: reading user-input failed!"，
    // 与本机 `octave-cli < /dev/null` 的行为一字不差）。
    stdin: (function () {
      var buf = "";
      function nextLine() {
        var q = window.__octaveStdin;
        if (q && q.length) { return String(q.shift()); }
        if (typeof window.prompt === "function") {
          var r = window.prompt("Input: ");
          return r === null ? null : r;
        }
        return null;
      }
      return function () {
        if (!buf) {
          var line = nextLine();
          if (line === null || line === undefined) { return null; }
          buf = line + "\n";
        }
        var c = buf.charCodeAt(0);
        buf = buf.slice(1);
        return c;
      };
    })(),
    postRun() {
      // Module.FS.mkdir("/working");
      // Module.FS.mount(Module.FS.filesystems["IDBFS"], {}, "/working");

      function chk(rv) {
        if (rv.err) console.error(rv.err);
        if (rv.out) console.log(rv.out);
      }
      function callModule(method, req) {
        let s = Module[method](JSON.stringify(req));
        return JSON.parse(s)
      }
      function disp(resp) {
        document.getElementById("output").innerText = JSON.stringify(resp, null, "  ");
      }

      Module["execute_interp"]();

      Module["eval_string"]('strcat("foo", "baz")');
      Module["feval"]("error", ["foo"], 0);
      // disp(Module["feval"]("strcat", ["foo", "bar"], 1));
      console.log(Module["last_error_message"]());

      // 资产车道：读清单但不预先加载任何东西（能力资产用到哪个才 fetch 哪个）。
      // 控制台里：await OctaveAssets.load('ode15s') / OctaveAssets.list()
      window.OctaveAssets.init().then(function () {
        console.log('[assets] 可用资产: ' + OctaveAssets.list().join(', '));
        // dldfcn 核心组：convhulln/delaunayn/voronoi/glpk/fftw/gzip/audioread 系列。
        // 走官方 dlopen 装载（与桌面版同一机制、同一 exist/which 语义）。
        // 这一组对应"开箱就该能用"的基础几何/压缩/音频，随页面一起装；
        // 其余资产仍按需懒加载。
        // 装不上不算致命——页面照常可用，只是这些函数不存在（会清晰报错）。
        var CORE_DLDFCN = ['convhulln', '__delaunayn__', '__voronoi__',
                           '__glpk__', 'fftw', 'gzip', 'audioread'];
        return OctaveAssets.load(CORE_DLDFCN).catch(function (e) {
          console.warn('[assets] dldfcn 核心组装载失败（这些函数将不可用）: ' + e.message);
          return null;
        });
      }).then(function () {
        // `help` 的数据依赖，同样属于"开箱就该能用"。
        //   built-in-docstrings：内建函数的 docstring 表。**必须随页面装**——
        //     没有它，`help sin` 直接报 "failed to open docstrings file"，
        //     而桌面版从不会有这个失败。它的内容是构建期用真 makeinfo 预渲染的
        //     纯文本（见 build/render-docstrings.py），所以 help 不需要 makeinfo。
        //   doc-cache：`lookfor` 和 help 目录列表用的索引。
        // 两个合计约 2.5MB，相对首包不算小，但换的是"学生第一个命令就能用"。
        //   plotbridge：plot/print 的纯 .m 桥（渲染走它）。
        //   webgraphics：**T2/A1 图形句柄**——它的 PKG_ADD 会 register+load 名为
        //     `web` 的最小 graphics toolkit，使 `figure/gcf/gca/get/set/title` 这些
        //     **图形对象句柄**真正存在（在此之前 figure 建不出来，gca 一律
        //     "invalid handle"，只剩 plot 桥能出图）。**必须随页面装**，否则
        //     用户第一个 `figure` 就撞 "no graphics toolkits are available!"。
        //   webdoc：**T6/D2a**——`doc` 的浏览器实现（官方 doc.m 末路是起 info
        //     浏览器进程，本构建无 shell）。它很小，且 `doc` 属于"开箱就该能用"。
        return OctaveAssets.load(['built-in-docstrings', 'doc-cache', 'macros.texi', 'plotbridge', 'webgraphics', 'webdoc'])
          .catch(function (e) {
            console.warn('[assets] help 数据装载失败（help/lookfor 将不可用）: ' + e.message);
            return null;
          });
      }).then(function () {
        // pkg 语义（T4）。**11.3.0 车道只需要 pkgfix 那一半**：
        //   pkgfix：从**磁盘现状**生成 pkg 数据库。Forge 包是由本加载器直接写进
        //     FS + addpath 的，从不经过 `pkg install`，所以数据库原本是空的。
        // ⚠️ **不要**再要求装 `installed_packages.m`：那是 **7.2 车道**的东西 ——
        //   上游 fork rwl/octave-wasm 把「读 .octave_packages 数据库」的 16 行换成了
        //   3 行空赋值，故当时要把官方文件放回去（build/pkgrestore/）。**vanilla
        //   11.3.0 那个文件是完好的**（PROMOTION.md 已核实），不需要还原。
        //   以前这里挂着它，清单里又没有这个资产 → 每次开页都打一句
        //   "pkg 支持装载失败（pkg list/load 将不可用）"，而 pkg 其实是好的，
        //   属**误导性告警**（accept-pkg 在 8761/8762 上都 16/16，已实测）。
        return OctaveAssets.load(['pkgfix'])
          .then(function () {
            try {
              window.Module.eval_string(
                "if (exist('__pkgfix_sync_db__')) " +
                "  try; __pkgfix_sync_db__ (); catch e; " +
                "    warning('pkg sync failed: %s', e.message); end; endif;");
            } catch (e) {
              console.warn('[pkg] 数据库同步失败: ' + e.message);
            }
            return null;
          })
          .catch(function (e) {
            console.warn('[assets] pkg 支持装载失败（pkg list/load 将不可用）: ' + e.message);
            return null;
          });
      }).then(function () {
        window.__octaveReady = true;
      }).catch(function (e) {
        console.warn('[assets] 清单未就绪（无 assets/ 目录时属正常）: ' + e.message);
        window.__octaveReady = true;
      });

      // 音频：开始轮询播放队列；首次点击解锁 AudioContext（浏览器 autoplay 策略）
      if (window.OctaveAudio) {
        window.OctaveAudio.init().catch(function (e) {
          console.warn('[audio] 桥未就绪: ' + e.message);
        });
        window.addEventListener('click', function once() {
          window.OctaveAudio.resume();
          window.removeEventListener('click', once);
        });
      }
      // 录音桥：只轮询队列。麦克风权限**不在页面加载时要** —— 那会在用户还没
      // 表达任何意图时弹权限框；真正要权限的时机是第一次 record()。
      if (window.OctaveRec) {
        window.OctaveRec.init().catch(function (e) {
          console.warn('[audiorec] 桥未就绪: ' + e.message);
        });
      }
    }
  }
</script>
<script type="text/javascript" src="octave.js"></script>
<script type="text/javascript">
  OCTAVE(Module);
</script>
</body>
</html>
