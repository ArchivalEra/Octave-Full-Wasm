<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>octave-wasm × gnuplot-wasm PoC（胶水验证页）</title>
</head>
<body>
<h3>octave-wasm × gnuplot-wasm PoC</h3>
<p id="status">loading…</p>
<button id="b1" disabled>1) y=x^2 → SVG</button>
<button id="b2" disabled>2) sin+cos → SVG</button>
<button id="b3" disabled>3) hist(randn) → SVG boxes</button>
<button id="b4" disabled>4) asciiplot（终端降级）</button>
<button id="b5" disabled>5) bridge: plot+hold+labels → SVG</button>
<button id="b6" disabled>6) bridge: scatter/stem/semilogx → SVG</button>
<button id="b7" disabled>7) marker showcase（pt 对照，待肉眼）</button>
<button id="b8" disabled>8) dashtype showcase（dt 对照，待肉眼）</button>
<button id="bR" disabled>Render（渲染当前 bridge 状态）</button>
<div id="plot"></div>
<h4>octave 输出</h4>
<pre id="log"></pre>

<script>
var Module = {
  print(t) { document.getElementById('log').textContent += t + '\n'; },
  printErr(t) { document.getElementById('log').textContent += t + '\n'; },
};
var VENDOR = ['asciiplot.m','betacdf.m','betainv.m','betapdf.m','chi2cdf.m',
  'fcdf.m','fft.m','fpdf.m','gamcdf.m','gaminv.m','gampdf.m','ifft.m',
  'normcdf.m','norminv.m','normpdf.m','regress.m','tcdf.m','tinv.m',
  'tpdf.m','ttest.m'];
var PBRIDGE = ['__pstate__.m','__pb_emit__.m','__pb_add__.m','plot.m','hold.m',
  'xlabel.m','ylabel.m','title.m','legend.m','xlim.m','ylim.m','grid.m',
  'clf.m','figure.m','scatter.m','stem.m','semilogx.m','semilogy.m',
  'loglog.m','bar.m'];
async function octaveReady() {
  for (let i = 0; i < 600; i++) {
    try {
      if (typeof Module.execute_interp === 'function') {
        Module.execute_interp();
        if (Module.feval('strcat', ['a', 'b'], 1)) return;
      }
    } catch (e) {}
    await new Promise(r => setTimeout(r, 500));
  }
  throw new Error('octave init timeout');
}
async function bootOctave() {
  await octaveReady();
  try { Module.FS.mkdir('/forge'); } catch (e) {}
  let n = 0;
  for (const f of VENDOR) {
    const r = await fetch('vendor/' + f);
    Module.FS.writeFile('/forge/' + f, await r.text());
    n++;
  }
  Module.eval_string("addpath('/forge'), rehash");
  try { Module.FS.mkdir('/plotbridge'); } catch (e) {}
  for (const f of PBRIDGE) {
    const r = await fetch('plotbridge/' + f);
    Module.FS.writeFile('/plotbridge/' + f, await r.text());
    n++;
  }
  Module.eval_string("addpath('/plotbridge'), rehash");
  return n;
}
</script>
<script src="octave.js"></script>
<script>
OCTAVE(Module);
bootOctave().then(n => {
  window.__oct = n;
  document.getElementById('status').textContent =
    'octave ready, vendor .m: ' + n + ', gnuplot: ' + (window.__gp ? 'ready' : 'loading…');
  ['b1','b2','b3','b4','b5','b6','b7','b8','bR'].forEach(id => document.getElementById(id).disabled = false);
});
</script>
<script type="module">
import initGp from './gp/index.js';
import { specToRender, markerShowcaseScript } from './plotbridge.js';
const gp = await initGp();
window.__gp = true;
const st = document.getElementById('status');
if (window.__oct) st.textContent += ' + gnuplot ready';

function runOct(expr) {
  const rc = Module.eval_string(expr);
  if (rc !== 0) throw new Error('octave rc=' + rc + ': ' + Module.last_error_message());
}
function readDat(p) {
  return new TextDecoder().decode(Module.FS.readFile(p));
}
function show(svg) {
  document.getElementById('plot').innerHTML = svg;
  window.__lastSvg = svg;
}
function clearLog() {
  document.getElementById('log').textContent = '';
}
document.getElementById('b1').onclick = () => {
  clearLog();
  runOct("x=(0:0.5:10).'; y=x.^2; D=[x y]; save -ascii /tmp/plot.dat D");
  const { svg } = gp.render('set xlabel "x"; set ylabel "y"; plot "p.dat" using 1:2 with lines title "y=x^2"',
    { data: { 'p.dat': readDat('/tmp/plot.dat') }, width: 640, height: 480 });
  show(svg);
};
document.getElementById('b2').onclick = () => {
  clearLog();
  runOct("t=(0:0.1:2*pi).'; D=[t sin(t) cos(t)]; save -ascii /tmp/sincos.dat D");
  const { svg } = gp.render('plot "d.dat" using 1:2 with lines title "sin", "" using 1:3 with lines title "cos"',
    { data: { 'd.dat': readDat('/tmp/sincos.dat') }, width: 640, height: 480 });
  show(svg);
};
document.getElementById('b3').onclick = () => {
  clearLog();
  runOct('[nn,xx]=hist(randn(1,2000),21); H=[xx(:) nn(:)]; save -ascii /tmp/hist.dat H');
  const { svg } = gp.render('set style fill solid 0.5; plot "h.dat" using 1:2 with boxes title "randn hist"',
    { data: { 'h.dat': readDat('/tmp/hist.dat') }, width: 640, height: 480 });
  show(svg);
};
document.getElementById('b4').onclick = () => {
  document.getElementById('plot').innerHTML = '';
  clearLog();
  runOct('t=0:50; asciiplot(t.*cos(t), t.*sin(t))');
};
function renderBridge() {
  const spec = JSON.parse(readDat('/tmp/pb_spec.json'));
  const { script, data } = specToRender(spec, readDat);
  const { svg } = gp.render(script, { data, width: 640, height: 480 });
  show(svg);
  return { nseries: spec.series.length, script };
}
document.getElementById('bR').onclick = () => {
  clearLog();
  const r = renderBridge();
  window.__bridge = r;
};
document.getElementById('b5').onclick = () => {
  clearLog();
  runOct("x=(0:0.5:10).'; plot(x, x.^2, '--ro'); hold on; plot(x, x.^3); hold off");
  runOct("xlabel('x'); ylabel('y'); title('powers'); legend('x^2','x^3','Location','NorthWest'); grid on");
  const r = renderBridge();
  window.__bridge = r;
};
document.getElementById('b6').onclick = () => {
  clearLog();
  runOct("x=(1:20).'; scatter(x, x+randn(20,1)*2); stem(x(1:10), x(1:10).^2)");
  const r1 = renderBridge();
  window.__bridge = r1;
};
document.getElementById('b7').onclick = () => {
  clearLog();
  const shots = markerShowcaseScript();
  const { svg } = gp.render(shots[0].script, { data: shots[0].data, width: 900, height: 500 });
  show(svg);
  window.__showcase2 = shots[1];
};
document.getElementById('b8').onclick = () => {
  clearLog();
  const shots = markerShowcaseScript();
  const { svg } = gp.render(shots[1].script, { data: shots[1].data, width: 900, height: 500 });
  show(svg);
};
</script>
</body>
</html>
