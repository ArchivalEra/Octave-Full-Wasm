# 三语 README 同批判据的 CI 正面兜底（工单 67，2026-10-26 入库）：
# reflect-hooks/pre-push §④ 要求**每次推送三份 README（en/zh/de）同批更新**，缺一份拒推
# —— 但 pre-push 可被 `git push --no-verify` 跳过（git 原生出口拦不住）。
# 本工作流跑**同一条判据**（zreflect/check_readme_sync.py --changed），语义照抄 pre-push：
#   · 判据按"推送集"（这批推送改了哪些文件）判，不区分内容 —— 只要没同时改三份 ⇒ 红；
#   · 新分支 / 全仓第一推：`rev-list <sha> --not --remotes`（pre-push 同款口径）；
#   · 名单可配：REFLECT_READMES（reflect-hooks/Einfacht.env）。
# ⚠️ 诚实边界：CI 只在 push 到 origin 时跑 —— 改写本地历史再强推的路径由 CI 报红
#    （事后暴露），不是实时拦截；本地 pre-push 仍是第一道。
name: readme-sync
on: [push]
jobs:
  readme-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }        # 全历史：新分支口径要 rev-list --not --remotes
      - uses: actions/setup-python@v5
        with: { python-version: '3.x' }
      - run: |
          set -e
          BEFORE="${{ github.event.before }}"
          ZERO=0000000000000000000000000000000000000000
          SHA="${{ github.sha }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "$ZERO" ]; then
            # 新分支 / 第一推：只判"尚未发布到任何远端"的提交（pre-push 同款）
            REV=$(git rev-list "$SHA" --not --remotes)
          else
            REV=$(git rev-list "$BEFORE..$SHA")
          fi
          echo "推送集提交数：$(echo "$REV" | wc -l)"
          git log --name-only --pretty=format: $REV | sed '/^[[:space:]]*$/d' > /tmp/changed.txt || true
          # 空推送集（如纯 tag / 无新内容）⇒ 判据无事可查，明说不假装查过
          if [ ! -s /tmp/changed.txt ]; then
            echo "readme-sync：推送集没有改任何文件 ⇒ 三语判据无事可查"
            exit 0
          fi
          python3 zreflect/check_readme_sync.py --changed /tmp/changed.txt
