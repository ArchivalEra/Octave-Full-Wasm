# 闸门的 CI 落点（Einfacht issue #4 ②；工单 67，2026-10-26 真正入库）：
# pre-commit/pre-push 可被 --no-verify 跳过、也只装在跑过 install 的机器上 ——
# 只在自己方便时生效的闸门 = "从未跑过的闸门"。CI 正面执行**不依赖部署树**的那批。
#
# ★ 判据集对账（工单 67 的结算条件，2026-10-26 实测对齐）：
#   `python3 zreflect/registry.py --run commit`（带 reflect-hooks/Einfacht.env）在本机
#   = ran 7 / off 6 / failed 0。**off 的 6 个**（check_ab/instruments/invariants/
#   locks/pins/world）= 平台未启用档，CI 也不跑（同一条声明，不另抄清单）。
#   **ran 7 里的 runner 可跑性逐个核过**：
#     · check_questions / check_retractions —— 纯仓库输入 ⇒ CI 跑；
#     · check_facts —— 块↔台账一致性（不测量）⇒ CI 跑；
#     · check_facts_replay —— **重测**台账 cmd（要 /mnt/hdd 部署树与产物）⇒ CI 不跑；
#     · check_stale —— 对 now() 判文档新鲜度（时间敏感，runner 上必假红）⇒ CI 不跑；
#     · witness-upstream-pin（docker 容器树）/ build/113/plugin-check（产物 declared，
#       也在部署树）⇒ CI 不跑。以上四个只在带部署树的机器上跑（pre-commit）。
#   本仓专属 .githooks/* 里 runner 可跑的与两份自证台全部进 CI；`git add -A` 让
#   check-whitelist 在 CI 上非空转（全跟踪集对白名单，与本地"只查暂存批"互补）。
#   ⚠️ 2026-11-12/13 修正（两次 CI 实测）：**不进 CI 的本仓闸门不止 check-state**——
#   update-readme --check / update-state --check 的 AUTO 块数据源含机器本地
#   sweep-logs/dist，runner 上恒"过期"红。runner 可跑清单最终 = check-wants /
#   whitelist / consistency / readiness-pattern / mail-boundary + 平台三件 +
#   两台 selftest。要部署树的闸门（check-state / readme-sync / state-sync /
#   check_facts_replay / witness-* / plugin-check）全在带部署树的机器跑。
name: gates
on: [push, pull_request]
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # ★ fetch-depth: 0（完整历史）：两台 selftest 里有**真仓形态用例**
          #   （facts.fresh_repo_bootstraps_green / real_repo_shaped_bootstraps /
          #   knobs.coverage_real_repo_clean / facts_cli 等），浅克隆（默认 depth=1）下
          #   必红 —— 2026-11-13 四次 CI 实测 + 本地浅克隆复现（症状逐字吻合：
          #   check_facts/facts_replay/facts_cli/knobs 自证 + 跨仓换名用例）。
          #   完整历史 ⇒ 自证在真仓形态上跑（与本地一致）。仓库体积可接受（无大件）。
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }

      - name: Install runner-side gate dependencies
        # 本仓专属闸门要的三样本机工具（2026-11-13 CI 逐项实测，见 run 43361595538）：
        #   · zstandard / brotli —— make-release --selftest 四编码判据缺则明说缺；
        #   · typescript —— var-audit.mjs 的 TS 解析器（它先找 crossbuild-tools，
        #     再回落到 NODE_PATH / 全局；runner 上走回落）；
        #   · octave-cli —— check_m.py 用真实 Octave 跑一遍合法 .m（runner 无则
        #     "合法 .m ⇒ 通过" 用例红）。
        # 与 quality-assessment.yml 的依赖面同一口径；不撤判据，把跑点配齐。
        run: |
          pip install zstandard brotli
          npm install -g typescript@5
          sudo apt-get update -qq && sudo apt-get install -y -qq octave
          echo "NODE_PATH=$(npm root -g)" >> "$GITHUB_ENV"

      - run: |
          # 平台闸门的旋钮（REFLECT_FACTS 等）唯一可复现来源 —— 不 source 必红
          # （实测：裸跑 check_facts 报"缺事实台账"，是输入没配，不是闸门坏了）。
          . reflect-hooks/Einfacht.env
          set -e
          # 本仓专属闸门（不依赖部署树）；git add -A 让白名单闸门查全跟踪集
          git add -A
          python3 .githooks/check-wants.py
          python3 .githooks/check-whitelist.py
          python3 .githooks/check-consistency.py
          python3 .githooks/check-readiness-pattern.py
          python3 .githooks/check-mail-boundary.py
          # ⚠️ check-state / update-readme --check / update-state --check 三件**都不进 CI**：
          #   · check-state 的零值守卫 2 要部署件或回归事实至少一条可读（/mnt/hdd 数据源），
          #     runner 上必判"闸门空转"红（2026-11-12 实测 run 43332066325）；
          #   · update-readme/update-state 的 AUTO 块数据源同含机器本地 sweep-logs/dist，
          #     runner 上重算必不同 ⇒ 恒"过期"红（2026-11-13 实测 run 43335004809，
          #     README 三语全部）。判据都是对的（无事实不装绿 / 块必须新鲜）——
          #     但它们是**带部署树的机器（pre-commit/pre-push）的闸门**，CI 不假装查过。
          # 平台闸门（runner 可跑的三件；跳过名单见文件头，不假装查过）
          python3 zreflect/check_questions.py
          python3 zreflect/check_retractions.py
          python3 zreflect/check_facts.py
          # ⚠️ 两台 selftest 挪进独立 step（见下）——它们必须跑在**干净环境**：
          #   delegated 自证继承 step 环境，REFLECT_* 旋钮泄进夹具 ⇒ 假红
          #   （2026-11-13 实测 run 43335566015：check_facts/facts_replay/facts_cli/knobs
          #    自证在带 env 的 step 里 1+2+2+2 条 fail；本地同 env 复现 next/registry 红）。
          #   这是上游 Einfacht #34 夹具 env 污染族的同族形状。

      # 自证台必须在**干净环境**跑（与 REFLECT_* 旋钮正交 —— delegated 自证继承
      # step 环境，旋钮泄进夹具即假红；上游 Einfacht #34 同族，2026-11-13 实测）。
      - name: Selftest suites (clean env)
        shell: bash
        run: |
          sh gates-selftest.sh
          sh build/gates-selftest.sh
