<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Octave Web</title>
  <pre id="output"></pre>
</head>
<body>
<script type="text/javascript" src="assets-loader.js"></script>
<!-- MEMFS 队列的**协议无关**部分（取 fs / 读走并清空 / 切分）：四个宿主桥共用。
     ⚠️ 必须在下面那几个桥之前加载（它们直接用 window.OctaveQueue）。 -->
<script type="text/javascript" src="queue.js"></script>
<!-- 真渲染后端（P5）：把 toolkit 渲好的 PNG（MEMFS 里）贴到页面。
     后端是 `webgl`（gl4es → GLES2 → **WebGL2/GPU**）；OSMesa（Mesa 软件光栅化）已于
     2026-09-23 退役（脚本与配方留在 git 历史的 graphics-osmesa 分支）。
     ⚠️ 这一段此前**只存在于部署站点、没进仓库**（仓库/部署漂移，2026-09-23 补回）。
     注意 `__init_*__` 那类 `.oct` 资产**不进启动清单**：toolkit 是编在主 wasm 里的，
     默认 toolkit 由 `build/webgraphics/PKG_ADD` 选中（有 webgl 就用它 ⇒ 开箱 `plot` 就出真图），
     也可以显式切换：`OctaveP5.useWebGL()` / `useWeb()` / `demo()`。
     ⚠️ C6 边界（2026-09-26）：p5canvas 仍是**默认实例**的单例桥 —— wasm 侧
     publish_png 调的是硬编码 `window.OctaveP5.show`（要改成分派须动
     webgl_toolkit.cc，与下一次重链合并）。非默认实例**没有图形上屏**。 -->
<script type="text/javascript" src="p5canvas.js"></script>
<!-- WebAudio 播放桥：Octave 侧把播放意图写进队列，这一侧真开 AudioContext。
     浏览器要求用户手势才能出声，所以页面上任何一次点击都会尝试解锁。 -->
<script type="text/javascript" src="webaudio.js"></script>
<!-- WebAudio **录音**桥（T7）：Octave 侧把录音意图写进队列，这一侧用 getUserMedia +
     MediaRecorder 真采集，再把 PCM 写回 MEMFS 供 getaudiodata 同步读取。
     与播放桥分开两个文件，是因为录音还有权限三态要处理。 -->
<script type="text/javascript" src="webaudiorec.js"></script>
<!-- 文件选择器桥（T8）：Octave 侧 __fltk_uigetfile__.oct 把请求写进队列，这一侧弹
     <input type=file>、把选中文件的字节写进 MEMFS，再由 Octave 复制进当前目录。
     因为是异步/同步的硬冲突，uigetfile 在这条路上是**两步**（详见桥里的说明）。 -->
<script type="text/javascript" src="webfilepick.js"></script>
<!-- 网络桥（R5）：`OctaveNet.prefetch/get` —— 页面侧异步取回 URL 写进 MEMFS，
     让 Octave 侧**同步**读（同步 XHR 那条自包含在 webnet.cc 的内联 JS 里）。
     ⚠️ 2026-09-23 审计查出：这个文件一直被部署、却**没被 index.html 加载**
     （而 test/browser/accept-net.mjs 的注释以为站点会加载它 —— 于是只有注入脚本的
     测试里它才存在）。这里补上那一行，让"部署的桥"与"加载的桥"一致。 -->
<script type="text/javascript" src="webnet.js"></script>
<!-- ★ A2（2026-09-26）：**内核**（页面宿主与 Worker 宿主共用的那一份）。
     这里只加载、不直接调 —— 页面侧由下面的 createOctaveHost 调 createOctaveCore。
     必须排在 octave.js **之前**（内核要提供 instantiateWasm / postRun 等配置）。 -->
<script type="text/javascript" src="octave-core.js"></script>
<script type="text/javascript">
  // ── 输出落点（T6c）────────────────────────────────────────────────────────
  // 上游骨架只留了一个空的 `<pre id="output">`，而且**没有人往里写东西**：
  // 实测 `disp(42)` 之后 `document.body.innerText` 仍是空串 —— 所有 Octave 输出
  // 都只进浏览器控制台，页面上什么也看不到。这对"打开链接就能用"是硬缺口，
  // 所以这里把 stdout/stderr **同时**显示到页面。
  //
  // ⚠️ 仍然照常走 console：验收套件（test/browser/accept-*.mjs）读的就是 console
  // 里的输出，只写 DOM 会把 26 套全打掉。是"额外再显示一份"，不是"改道"。
  function octaveUiAppend(s) {
    var el = document.getElementById('output');
    if (!el) {
      el = document.createElement('pre');
      el.id = 'output';
      document.body.appendChild(el);
    }
    el.appendChild(document.createTextNode(s));
    // 只在页面真的可滚动时才跟到底部：输出多的时候避免每次写都做一次布局查询。
    // ★ 2026-09-26 修：**读 `scrollHeight` 会强制同步布局**，海量输出时每条都读 =
    //   37 次 ×(300KB 文本的)布局 ≈ 2 秒 ⇒ 主线程照样被卡（外部评审 C-4 的"背压"问题
    //   真身在这里，不在 worker 的消息条数）。⇒ 按时间**节流**（200ms 一次）。
    var __now = (window.performance && performance.now) ? performance.now() : Date.now();
    if (__now - (window.__octaveScrollAt || 0) > 200) {
      window.__octaveScrollAt = __now;
      if (document.documentElement.scrollHeight > window.innerHeight) {
        window.scrollTo(0, document.body.scrollHeight);
      }
    }
  }

  // ── C6（2026-09-26）：实例注册表 + 全局监听 fan-out ─────────────────────────
  // 以前整套桥按"页面单例"设计（固定 id + 固定 window 全局 + 共享点击队列），
  // 同页第二个实例必然互踩。现在：每个实例有自己的点击队列（arm/pending/pop 三个
  // import 由工厂按实例覆写，见 createOctaveHost），全局 pointerdown **扇出**给所有
  // armed 的实例。window.__octaveClicks / __octaveClicksArmed 保留为**默认实例**的
  // 别名（wasm 侧 webjslib 的原始实现读它们；覆写后默认实例语义不变）。
  window.__octaveHosts = [];
  window.__octaveClicks = [];
  window.__octaveClicksArmed = false;
  window.addEventListener('pointerdown', function (e) {
    var el = e.target;
    if (!el || (el.tagName !== 'IMG' && el.tagName !== 'CANVAS')) return;
    var r = el.getBoundingClientRect();
    if (!r.width || !r.height) return;
    var click = [e.clientX - r.left, e.clientY - r.top, r.width, r.height,
                 e.button === 2 ? 3 : (e.button === 1 ? 2 : 1)];
    var hit = false;
    for (var i = 0; i < window.__octaveHosts.length; i++) {
      var h = window.__octaveHosts[i];
      if (h.armed) { h.clicks.push(click); hit = true; }
    }
    if (hit) e.preventDefault();
  });
  // ── G4 Ctrl-C：Ctrl+C（Cmd+C 不拦，mac 用户用按钮/函数）→ 置位中断旗标 ──────
  // ⚠️ 只在解释器**正在跑**时才有意义；CPU 密集循环不经过安全点 ⇒ 不是抢占（如实记）。
  //    C6 边界：中断走 window.Module（默认实例）；非默认实例的中断要用它自己的
  //    Module._web_request_interrupt（实例对象上就有）。
  window.addEventListener('keydown', function (e) {
    if (e.ctrlKey && (e.key === 'c' || e.key === 'C')) {
      try { if (window.Module && window.Module._web_request_interrupt) window.Module._web_request_interrupt(); } catch (err) {}
    }
  });
  window.__octaveRequestInterrupt = function () {
    try { if (window.Module && window.Module._web_request_interrupt) window.Module._web_request_interrupt(); } catch (err) {}
  };

  // ── C6：实例工厂（★ A2 起它只是**页面适配器** —— 逻辑全在 bridge/octave-core.js）──────
  // 用法：var mod = createOctaveHost({ base: '', mount: '#host2', home: '/home/web_user/i2', id: 'i2' });
  //       OCTAVE(mod);                       // octave.js 的工厂（MODULARIZE），自己调
  // opts：
  //   base  资源前缀（wasm/.data/manifest/全部资产）——嵌进子目录或别的路径时用
  //   mount 输出区挂点（选择器）；缺省 = 页面级 #output（默认实例语义）
  //   home  IDBFS 挂载点；缺省 /home/web_user。非默认实例**必须**换一个，
  //         否则同源下两个实例的 syncfs 会互相覆盖同一批持久键
  //   id    实例名（注册表与报错里用）
  // 返回 Module 形态的对象（喂给 OCTAVE()）；**第一个**创建的实例是"默认实例"，
  // 拿走全部 window.* 兼容别名（window.Module / __octaveReady / OctaveAssets / …）——
  // 77 个验收套件与既有页面读的就是这些名字，语义一字不变。
  // ⚠️ 已知边界（C6=页面层，产物不变）：图形上屏与四个队列桥（audio/rec/filepick/net）
  //    仍是默认实例单例；非默认实例的 eval/FS/资产完全独立，但 plot 不上屏、
  //    音频队列不被 drain —— 分派要动 wasm 侧（webgl_toolkit.cc），与下一次重链合并。
  //
  // 这一侧只提供"只有页面才知道的"那几件（10 件接口里的页面实现，见 core 文件头）：
  //   print/printErr（console + 上屏，**两条都要**：套件读 console，人读 DOM）、
  //   note（诊断走 console.warn）、stdinLine（__octaveStdin 队列 → window.prompt 回落）、
  //   doc（真 document）、clicks（每实例一个队列）、assets（默认实例复用文件级那份）、onReady。
  window.createOctaveHost = function (opts) {
    opts = opts || {};
    var base = opts.base || '';
    var isDefault = (window.__octaveHosts.length === 0);
    var inst = {
      id: opts.id || (isDefault ? 'default' : ('inst-' + window.__octaveHosts.length)),
      clicks: [], armed: false, ready: false, mem: null, mod: null,
    };

    // 输出区：指定 mount 就在挂点里开自己的 <pre>；否则用页面级 #output。
    // ⚠️ 挂点解析放在**注册之前**：挂点不存在必须 throw，且不许在注册表里留下幽灵实例。
    var uiAppend;
    if (opts.mount) {
      var mountEl = document.querySelector(opts.mount);
      if (!mountEl) { throw new Error('createOctaveHost: 找不到挂点 ' + opts.mount); }
      var outEl = document.createElement('pre');
      mountEl.appendChild(outEl);
      uiAppend = function (s) { outEl.appendChild(document.createTextNode(s)); };
    } else {
      uiAppend = octaveUiAppend;
    }
    window.__octaveHosts.push(inst);      // 注册：内核会把 armed/ready/mem 写在这个对象上

    // 点击队列：**每实例一个**（旧实现读 window 全局 ⇒ 同页两实例互踩）。
    // 全局 pointerdown 把命中扇出给所有 armed 的实例（见文件顶部那段）。
    var clicks = {
      list: [],
      length: function () { return clicks.list.length; },
      push: function (c) { clicks.list.push(c); },
      shift: function () { return clicks.list.shift(); },
      clear: function () { clicks.list.length = 0; },
    };
    inst.clicks = clicks.list;            // 兼容：既有断言读 inst.clicks 的长度

    var core = window.createOctaveCore({
      base: base, mode: 'single', isDefault: isDefault, home: opts.home,
      state: inst, clicks: clicks,
      // ★ B6：**必须转发** —— 不转发的话页面按档加载了 `threads/octave.js` 胶水，内核却去取
      //   根目录的 `octave.wasm`（基础档）⇒ 胶水/产物不匹配，开机当场
      //   `BindingError: Cannot register multiple overloads of a function with the same number
      //   of arguments (0)!`（probe-lane 实测抓到；`caps.chosen` 会显示 base 而 plan 是 threads）。
      // ★★ 第二处（2026-09-27，accept-embed-multi 实测）：**不带 opts.lane 的第二个实例**也会
      //   掉进同一个坑 —— 内核的缺省是基础档，而页面上只加载了**本档的**胶水（`document.write`
      //   写死一份）⇒ 两个实例一个线程档胶水 + 一个基础档产物，第二个实例 `eval_string is not
      //   a function`（表现成 i2Ready=false）。所以缺省值必须是**页面的选档计划**（页面只有一档）。
      lane: opts.lane || window.__octaveLanePlan,
      host: {
        // ⚠️ 仍然照常走 console：验收套件读的就是 console 里的输出，只写 DOM 会把 26 套全打掉。
        print: function (t) { console.log(t); uiAppend(t + '\n'); },
        printErr: function (t) { console.warn(t); uiAppend(t + '\n'); },
        note: function (m) { console.warn(m); },
        stdinLine: function () {
          var q = window.__octaveStdin;
          if (q && q.length) { return String(q.shift()); }
          if (typeof window.prompt === "function") {
            var r = window.prompt("Input: ");
            return r === null ? null : r;
          }
          return null;
        },
        doc: document,
        assets: function (mod, b, isReady) {
          // 默认实例**复用** assets-loader.js 文件级创建的那份（惰性绑 global.Module）——
          // 否则测试读的（window.OctaveAssets）与 boot 链用的不是同一份状态。
          if (isDefault && window.OctaveAssets) { return window.OctaveAssets; }
          return window.createOctaveAssets(mod, b, isReady);
        },
        onReady: function () { inst.ready = true; if (isDefault) { window.__octaveReady = true; } },
      },
    });
    inst.mod = core.module;
    inst.core = core;
    if (isDefault) {
      window.__octaveClicks = clicks.list;   // 别名 = 默认实例的队列（webjslib 原始实现读它）
      window.__octaveCaps = core.caps;       // Capabilities（D4）：开机算一次，消费者只读
    }
    return core.module;
  };
</script>
<!-- ★ B6（2026-09-27）：**选档**（线程档 / 基础档）。
     `lane.js` 用**同步**判据（crossOriginIsolated + SharedArrayBuffer）定档，然后**在解析期**
     按档加载胶水 —— 线程档产物在没有跨源隔离的页面上连实例化都做不到，所以不能等异步探测。
     为什么用 `document.write`：下面的启动逻辑假定"胶水已就绪"（parse 顺序语义）。换异步加载
     就得把整段启动改写进回调里（改动面大得多）；这里是**只在解析期写一次**的经典用法。
     ⚠️ 线程档的文件名与基础档**相同**，放在 `threads/` 子目录（胶水内部写死的 `octave.data`
     引用因此不用改，见 lane.js 的说明）。 -->
<script type="text/javascript" src="lane.js"></script>
<script type="text/javascript">
  window.__octaveLanePlan = octaveLaneFiles(octaveLaneState.lane);
  document.write('<script type="text/javascript" src="'
                 + window.__octaveLanePlan.js + '"><\/script>');
</script>
<script type="text/javascript">
// ── C3/B5（2026-09-26）：两种宿主，**默认路径一字不动** ────────────────────────
// 缺省（无 `?worker=1`）= 单页模式：解释器在主线程（现役产物行为，77 个验收套件全靠它）。
// `?worker=1` = **Worker 模式**：wasm + FS + 资产 + JSPI 全在 DedicatedWorker 里，主线程只
// 做 DOM 与转发 ⇒ 长计算（`A=rand(2000); A*A`）**不再冻页面**。机制前提已实测（Q4/E4）。
// ⚠️ Worker 模式 phase 1 的已知边界：图形真渲染后端（WebGL toolkit）在 worker 里起不来
//   （EM_ASM 建 canvas 需要真 DOM）⇒ 走 plotbridge 回落；把 WebGL 搬进 worker 要改
//   webgl_toolkit.cc 并重链（B5 phase 2）。stdin 在 worker 里如实 EOF（没有 prompt）。
(function () {
  var params = new URLSearchParams(location.search);
  if (params.get('worker') !== '1') {
    window.Module = window.createOctaveHost({ id: 'default',
                                              lane: window.__octaveLanePlan });
    OCTAVE(window.Module);
    return;
  }
  var base = params.get('base') || '';
  // ★ B6（2026-09-27）：**把选档结果传给 worker**。Worker 里的 `location.search` 是
  //   **worker 脚本自己的** URL，看不到页面的 `?lane=`/`?worker=` ⇒ 不传的话 worker 会自己按
  //   `crossOriginIsolated` 再判一次，两边可能不一致（实测：页面写 `?lane=base` 对 worker
  //   **无效**，worker 仍选线程档 ⇒ `accept-worker` 4/12）。lane.js 的 `override()` 读
  //   `env.location.search` ⇒ 把档写进 Worker URL 就行（一行，且 worker 侧无需改动）。
  var w = new Worker('octave-worker.js?lane=' + encodeURIComponent(window.__octaveLanePlan.lane));
  var seq = 0, pending = {};
  var API = { mode: 'worker', booted: true, ready: false, interrupted: 0, plots: 0 };
  function call(kind, payload) {
    return new Promise(function (resolve, reject) {
      var id = ++seq;
      pending[id] = { resolve: resolve, reject: reject };
      try { w.postMessage(Object.assign({ id: id, kind: kind }, payload)); }
      catch (e) { delete pending[id]; reject(e); }
    });
  }
  // ★ 结算保证（外部评审 C-3/C-6）：worker 崩溃或被 terminate 时，**不许留下永不 settle
  //   的僵尸 Promise**（否则 UI 永远卡在 loading）。onerror 与 terminate 都把待办全部 reject。
  function failAllPending(err) {
    Object.keys(pending).forEach(function (id) {
      try { pending[id].reject(err); } catch (e) {}
      delete pending[id];
    });
  }
  // ★ 上屏**合批**（2026-09-26，外部评审 C-4 的另一半）：worker 已按 8KB 合批，但页面侧
  //   每条仍做 console.log + DOM 追加 + 布局 ⇒ 5 万行实测主线程被占 ~170ms。改成
  //   rAF 合批（最多 60fps 一次），并在**结果到达前 flush**（保证测试立即读得到 #output）。
  var uiBuf = '', uiPending = false;
  function flushUi() {
    uiPending = false;
    if (!uiBuf) return;
    octaveUiAppend(uiBuf);
    uiBuf = '';
  }
  function queueUi(t) {
    uiBuf += t + '\n';
    if (!uiPending) { uiPending = true; (window.requestAnimationFrame || setTimeout)(flushUi); }
  }
  w.onmessage = function (ev) {
    var m = ev.data || {};
    if (m.kind === 'out') { queueUi(String(m.text)); return; }
    if (m.kind === 'ready') {
      API.ready = true; window.__octaveReady = true;
      console.log('[worker] ready' + (m.warn ? '（有告警：' + m.warn + '）' : ''));
      return;
    }
    if (m.kind === 'plot') {
      try {
        var blob = new Blob([m.ab], { type: m.path.indexOf('.svg') >= 0 ? 'image/svg+xml' : 'image/png' });
        var img = document.createElement('img');
        img.src = URL.createObjectURL(blob);
        img.style.maxWidth = '100%';
        document.body.appendChild(img);
        API.plots++;
      } catch (e) { console.warn('[worker] 图上屏失败: ' + e); }
      return;
    }
    if (m.kind === 'fatal') { console.error('[worker] ' + m.err); return; }
    if (m.id && pending[m.id]) { flushUi(); var cb = pending[m.id]; delete pending[m.id]; cb.resolve(m); }
  };
  w.onerror = function (e) {
    var msg = '[worker] onerror: ' + (e && e.message ? e.message : 'unknown');
    console.error(msg);
    API.crashed = msg;
    failAllPending(new Error('WorkerCrashError: ' + msg));   // ★ 立刻失败，不等超时
    return true;
  };
  API.eval = function (code) { return call('eval', { code: code }); };
  API.evalAsync = function (code) { return call('evalAsync', { code: code }); };
  API.loadAssets = function (names) { return call('loadAssets', { names: names }); };
  // ★ 受控 teardown：拒绝所有待办（AbortError）后 terminate —— 供"崩溃/重启/换实例"用
  API.terminate = function () {
    try { failAllPending(new DOMException('Aborted', 'AbortError')); } catch (e) {}
    try { w.terminate(); } catch (e) {}
    API.terminated = true;
  };
  API.diagnose = function () { return call('diagnose', {}).then(function (m) { return m.d; }); };
  API.interrupt = function () { API.interrupted++; w.postMessage({ kind: 'interrupt' }); };
  window.OctaveWorker = API;
  // 点击一律转发（worker 侧 `arm` 时会清空队列 ⇒ "第二次点击不误触发下一次 ginput" 仍成立）
  window.addEventListener('pointerdown', function (e) {
    var el = e.target;
    if (!el || (el.tagName !== 'IMG' && el.tagName !== 'CANVAS')) return;
    var r = el.getBoundingClientRect();
    if (!r.width || !r.height) return;
    w.postMessage({ kind: 'click', data: [e.clientX - r.left, e.clientY - r.top, r.width, r.height,
                                          e.button === 2 ? 3 : (e.button === 1 ? 2 : 1)] });
  });
  w.postMessage({ kind: 'opts', base: base, home: params.get('home') || undefined });
})();
</script>
<!--
  速度探针（**默认关**，只在带 `?bench=1` 时跑）：量"真渲染后端"的墙钟。
  为什么放在页面里而不是外面驱动：手机/Android WebView 那种环境**没有 DevTools 可连**，
  但 `console.log` 会进 `adb logcat`（`chromium: [INFO:CONSOLE]`）⇒ 这是唯一能自动化取数的通道。
  桌面侧也一样能用（playwright 抓 console）。

  用法：  index.html?bench=1&tk=webgl            → 量当前默认
          index.html?bench=1&tk=web&n=5          → 切到 web（只出句柄、渲染归 plot 桥），重复 5 次
  输出：一行一条 `BENCH <label> = <ms> ms`，最后 `BENCH DONE tk=…`。
-->
<script type="text/javascript">
(function () {
  var q = new URLSearchParams(location.search);
  if (q.get('bench') !== '1') return;

  var TK = q.get('tk') || '';
  var N  = parseInt(q.get('n') || '5', 10);

  function log(s) { console.log('BENCH ' + s); }

  function ready() {
    if (!window.__octaveReady || !window.Module || !window.Module.eval_string) return false;
    try { return window.Module.eval_string('1+1;') === 0; } catch (e) { return false; }
  }

  var waited = 0;
  var poll = setInterval(function () {
    waited += 500;
    if (!ready()) {
      if (waited > 600000) { clearInterval(poll); log('TIMEOUT 等 __octaveReady 超时'); }
      return;
    }
    clearInterval(poll);
    setTimeout(run, 500);
  }, 500);

  function ev(expr) {
    try {
      var r = window.Module.eval_string(expr);
      // 每条命令之后**去抖写回**一次（800 ms 合并；明确的同步点在 postRun 的 webSync）。
      // 不写回的话，`save("x.mat")` 只落在 MEMFS 里，一刷新就没了（MEMFS 是内存）。
      if (window.__octaveSyncSoon) window.__octaveSyncSoon();
      return r;
    }
    catch (e) { log('ERR ' + String(e).slice(0, 160)); return -1; }
  }

  // 一次计时 = 整段 Octave 表达式的墙钟（渲染是同步的，所以这一格就是"这张图要多久"）
  function time1(label, expr) {
    var t = performance.now();
    var rc = ev(expr);
    var ms = performance.now() - t;
    var extra = '';
    if (rc !== 0) {
      // rc≠0 时那一格**是无效数据**（没干活所以快）——把 Octave 的报错原文带出来，
      // 否则会误读成"这个后端很快"（本项目为此付过代价）。
      var msg = '';
      try { msg = String(window.Module.last_error_message() || '').replace(/\s+/g, ' ').slice(0, 180); } catch (e) {}
      extra = ' (rc=' + rc + ' INVALID! err=' + msg + ')';
    }
    log(label + ' = ' + ms.toFixed(1) + ' ms' + extra);
    return ms;
  }

  function run() {
    log('START tk=' + (TK || '(default)') + ' n=' + N + ' ua=' + navigator.userAgent.slice(0, 60));

    // 先把"这台环境有没有 WebGL"记下来 —— 否则 webgl 后端取不到上下文时，
    // 只能看见一句 "failed to capture frame data"，看不出根因在环境还是在我们代码。
    try {
      var c = document.createElement('canvas');
      var g2 = c.getContext('webgl2'), g1 = c.getContext('webgl');
      log('caps webgl2=' + (!!g2) + ' webgl1=' + (!!g1));
      var gl = g2 || g1;
      if (gl) {
        var dbg = gl.getExtension('WEBGL_debug_renderer_info');
        log('caps renderer=' + (dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER)));
      }
    } catch (e) { log('caps ERR ' + String(e).slice(0, 120)); }

    time1('boot_ready_wall', '1+1;');                  // 探针自身的基线开销

    if (TK) {
      var t = performance.now();
      var rc = ev("graphics_toolkit('" + TK + "');");
      log('switch_to_' + TK + ' = ' + (performance.now() - t).toFixed(1) + ' ms (rc=' + rc + ')');
      if (rc !== 0) { log('DONE 后端不可用'); return; }
    }

    // ── 纯渲染：getframe 必然走 toolkit 的 render()，不像 drawnow 可能被"没脏"跳过 ──
    ev('figure(1); clf; line(1:200, sin((1:200)/10)); drawnow(); "w"');
    ev('figure(2); clf; surface(peaks(40)); drawnow(); "w"');

    var acc2 = 0, acc3 = 0;
    for (var i = 0; i < N; i++) acc2 += time1('render_2d_line', 'p=getframe(1);');
    for (var j = 0; j < N; j++) acc3 += time1('render_3d_surface', 'p=getframe(2);');
    log('AVG render_2d_line = ' + (acc2 / N).toFixed(1) + ' ms');
    log('AVG render_3d_surface = ' + (acc3 / N).toFixed(1) + ' ms');

    // ── 端到端（含 plot 桥的 mirror 开销；两个后端一样，作对照）──
    for (var k = 0; k < 3; k++) time1('e2e_surf_drawnow', 'figure(9); clf; surf(peaks(40)); drawnow();');

    // ── 上下文诊断：放在**渲染尝试之后**跑，因为 toolkit 的 #octave-gl-canvas
    //    只有在第一次 redraw 时才会被建出来。目的：区分"整个环境的 WebGL 不可用"
    //    与"只有我们/emscripten 的建法不可用"。──
    try {
      function probe(label, sel) {
        var el = sel ? document.querySelector(sel) : document.createElement('canvas');
        if (!el) { log('diag ' + label + ' = 元素不存在'); return; }
        if (!sel) { el.width = 64; el.height = 64; }
        var s = '';
        [['webgl2', {}], ['webgl2', { failIfMajorPerformanceCaveat: true }], ['webgl', {}]].forEach(function (pair) {
          var g = null, err = '';
          try { g = el.getContext(pair[0], pair[1]); } catch (e) { err = String(e).slice(0, 60); }
          s += pair[0] + (pair[1].failIfMajorPerformanceCaveat ? '(caveat)' : '') + '=' + (g ? 'OK' : 'null') + (err ? '!' + err : '') + ' ';
        });
        log('diag ' + label + ' (' + (el.width + 'x' + el.height) + ') ' + s);
      }
      probe('fresh-canvas');
      probe('toolkit-canvas', '#octave-gl-canvas');
    } catch (e) { log('diag ERR ' + String(e).slice(0, 140)); }

    log('DONE tk=' + (TK || '(default)'));
  }
})();
</script>
</body>
</html>
